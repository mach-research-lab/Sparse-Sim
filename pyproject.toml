[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-sim"
version = "0.1.0"
description = "Sparse-kernel simulator for SIMA/VIA/InnerSP/ASA model studies"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
]

[project.scripts]
sparse-sim = "sparse_sim.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
